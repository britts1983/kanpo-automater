name: Daily Kanpo naturalization notice monitor
on:
  schedule:
    # GitHub Actions uses UTC; 00:00 UTC = 09:00 JST
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python monitor.py
      - name: Commit updated metadata CSV
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/notices.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Update Kanpo notice metadata'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kanpo-notice-metadata
          path: data/notices.csv
